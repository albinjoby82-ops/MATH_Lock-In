<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATH Lock-In · MATH20290</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f6f4ee;--card:#fffdf8;--ink:#1d2430;--mute:#5d6675;--line:#ddd8cb;--acc:#1f5fbf;--acc2:#e8f0fd;--ok:#1d7a4a;--ok2:#e3f4ea;--warn:#a85b00;--warn2:#fdf0dc;--step:#f1eee4}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2027;--ink:#e8eaee;--mute:#9aa3b2;--line:#303641;--acc:#7fb0ff;--acc2:#1d2a40;--ok:#6fd39a;--ok2:#173024;--warn:#f0b866;--warn2:#3a2c14;--step:#232831}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:20px;margin:0 6px 2px}
nav .sub{color:var(--mute);font-size:14px;margin:0 6px 12px}
.bar{height:8px;background:var(--step);border-radius:9px;margin:0 6px 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.part{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 6px 6px}
.tbtn{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 8px;font-size:15.5px;line-height:1.3}
.tbtn:hover{background:var(--step)}
.tbtn.on{background:var(--acc2);color:var(--acc);font-weight:700}
.tbtn small{color:var(--mute);white-space:nowrap;font-weight:400}
.tbtn.full small{color:var(--ok);font-weight:700}
main{padding:26px clamp(14px,4vw,48px) 80px;max-width:900px;width:100%}
.src{color:var(--mute);font-size:14px}
h2{font-size:27px;line-height:1.25;margin:2px 0 14px}
details.method{background:var(--acc2);border-radius:12px;padding:12px 18px;margin-bottom:18px}
details.method summary{cursor:pointer;font-weight:700;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 10px;font-size:14.5px;min-width:44px}
.chip.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.chip.done{background:var(--ok2);border-color:var(--ok);color:var(--ok)}
.chip.again{background:var(--warn2);border-color:var(--warn);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px clamp(14px,3vw,28px)}
.qref{font-size:14px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.qtext{font-size:19px;margin:4px 0 6px}
.try{color:var(--mute);font-size:15px;border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.step{background:var(--step);border-radius:10px;padding:10px 16px;margin-top:12px}
.step h3{margin:0 0 2px;font-size:16.5px}
.step h3 span{display:inline-block;background:var(--acc);color:var(--card);border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-size:14px;margin-right:8px}
.ans{background:var(--ok2);border:2px solid var(--ok);border-radius:10px;padding:10px 16px;margin-top:14px}
.ans b.l{color:var(--ok);display:block;font-size:14px;letter-spacing:.06em}
p{margin:8px 0}
.dm{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:8px 0}
.katex{font-size:1.12em}.katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;padding:3px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.b{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px}
.b.pri{background:var(--acc);border-color:var(--acc);color:var(--card);font-weight:700}
.b.ok{background:var(--ok);border-color:var(--ok);color:var(--card);font-weight:700}
.b.warn{border-color:var(--warn);color:var(--warn)}
.b:disabled{opacity:.4;cursor:default}
.keys{color:var(--mute);font-size:13.5px;margin-top:14px}
.fig{margin:10px 0;text-align:center}.fig figcaption{font-size:14px;color:var(--mute)}
.fig .ax{stroke:var(--mute);stroke-width:1}.fig .lb{fill:var(--ink);font-size:10px}
.fig .in{fill:var(--acc);fill-opacity:.22;stroke:none}.fig .out{stroke:#d04a3a;stroke-width:2;stroke-dasharray:5 4;fill:none}
.fig .edge{stroke:var(--acc);stroke-width:2.5;fill:none}.fig .hole{fill:var(--card);stroke:#d04a3a;stroke-width:2}
#menu{display:none}
@media (max-width:820px){.app{display:block}nav{position:fixed;inset:0 20% 0 0;z-index:5;transform:translateX(-100%);transition:.2s;height:auto}nav.open{transform:none;box-shadow:0 0 0 100vw #0007}#menu{display:inline-block;margin-bottom:10px}}
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main>
    <button class="b" id="menu">☰ Topics</button>
    <div id="view"></div>
  </main>
</div>
<script src="data.js"></script>
<script>
(function(){
var D=window.DATA, topics=[], KEY='mathlockin-v1', st={};
D.forEach(function(p){p.topics.forEach(function(t){topics.push(t)})});
try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var cur={t:0,q:0,shown:0};
try{var h=JSON.parse(localStorage.getItem(KEY+'-pos'));if(h&&topics[h.t]&&topics[h.t].qs[h.q]){cur.t=h.t;cur.q=h.q}}catch(e){}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function math(node){if(window.renderMathInElement)renderMathInElement(node,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
function short(ref){return ref.replace(/^Sheet \d+ · /,'')}
function nav(){
  var n=document.getElementById('nav');n.innerHTML='';
  var total=0,done=0;topics.forEach(function(t){t.qs.forEach(function(q){total++;if(st[q.id]==='done')done++})});
  n.appendChild(el('h1','','MATH Lock-In'));
  n.appendChild(el('div','sub','MATH20290 · '+done+' of '+total+' questions done'));
  var bar=el('div','bar','<i style="width:'+(100*done/total)+'%"></i>');n.appendChild(bar);
  var i=0;
  D.forEach(function(p){
    n.appendChild(el('div','part',p.title));
    p.topics.forEach(function(t){
      var idx=i++, d=t.qs.filter(function(q){return st[q.id]==='done'}).length;
      var b=el('button','tbtn'+(idx===cur.t?' on':'')+(d===t.qs.length?' full':''),'<span>'+t.title+'</span><small>'+d+'/'+t.qs.length+'</small>');
      b.onclick=function(){cur={t:idx,q:0,shown:0};n.classList.remove('open');render();window.scrollTo(0,0)};
      n.appendChild(b);
    });
  });
}
function render(){
  try{localStorage.setItem(KEY+'-pos',JSON.stringify({t:cur.t,q:cur.q}))}catch(e){}
  nav();
  var t=topics[cur.t], q=t.qs[cur.q], v=document.getElementById('view');v.innerHTML='';
  v.appendChild(el('div','src',t.src));
  v.appendChild(el('h2','',t.title));
  var m=el('details','method','<summary>Method (read this first)</summary>'+t.method);
  if(cur.q===0)m.open=true;v.appendChild(m);
  var chips=el('div','chips');
  t.qs.forEach(function(x,i){var c=el('button','chip'+(i===cur.q?' on':'')+(st[x.id]?' '+st[x.id]:''),short(x.ref));c.onclick=function(){cur.q=i;cur.shown=0;render()};chips.appendChild(c)});
  v.appendChild(chips);
  var card=el('div','card');
  card.appendChild(el('div','qref',q.ref+' · question '+(cur.q+1)+' of '+t.qs.length));
  card.appendChild(el('div','qtext',q.q));
  var n=q.steps.length, all=cur.shown>n;
  if(cur.shown===0)card.appendChild(el('div','try','Try it on paper first. Then reveal one step at a time.'));
  q.steps.slice(0,cur.shown).forEach(function(s,i){card.appendChild(el('div','step','<h3><span>'+(i+1)+'</span>'+s.t+'</h3>'+s.b))});
  if(all)card.appendChild(el('div','ans','<b class="l">ANSWER</b>'+q.a));
  var row=el('div','row');
  if(!all){
    var b1=el('button','b pri',cur.shown===0?'Show step 1':(cur.shown<n?'Next step ('+(cur.shown+1)+' of '+n+')':'Show answer'));
    b1.onclick=function(){cur.shown++;render()};row.appendChild(b1);
    var b2=el('button','b','Show full solution');b2.onclick=function(){cur.shown=n+1;render()};row.appendChild(b2);
  }else{
    var g=el('button','b ok','Got it → next question');g.onclick=function(){st[q.id]='done';save();next()};row.appendChild(g);
    var a=el('button','b warn','Need to redo this');a.onclick=function(){st[q.id]='again';save();next()};row.appendChild(a);
    var hgt=el('button','b','Hide solution');hgt.onclick=function(){cur.shown=0;render()};row.appendChild(hgt);
  }
  card.appendChild(row);v.appendChild(card);
  var row2=el('div','row');
  var pv=el('button','b','← Previous');pv.onclick=prev;pv.disabled=(cur.t===0&&cur.q===0);row2.appendChild(pv);
  var nx=el('button','b','Skip →');nx.onclick=next;nx.disabled=(cur.t===topics.length-1&&cur.q===t.qs.length-1);row2.appendChild(nx);
  v.appendChild(row2);
  v.appendChild(el('div','keys','Keys: Space = next step · A = full solution · → / ← = next / previous question'));
  math(v);
  if(cur.shown>0){var last=card.querySelector('.ans')||card.querySelectorAll('.step')[cur.shown-1];if(last&&last.scrollIntoView)last.scrollIntoView({block:'nearest',behavior:'smooth'})}
}
function next(){var t=topics[cur.t];if(cur.q<t.qs.length-1){cur.q++}else if(cur.t<topics.length-1){cur.t++;cur.q=0}cur.shown=0;render();window.scrollTo(0,0)}
function prev(){if(cur.q>0){cur.q--}else if(cur.t>0){cur.t--;cur.q=topics[cur.t].qs.length-1}cur.shown=0;render();window.scrollTo(0,0)}
document.getElementById('menu').onclick=function(){document.getElementById('nav').classList.toggle('open')};
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
  var n=topics[cur.t].qs[cur.q].steps.length;
  if(e.key===' '){e.preventDefault();if(cur.shown<=n){cur.shown++;render()}}
  else if(e.key==='a'||e.key==='A'){cur.shown=n+1;render()}
  else if(e.key==='ArrowRight')next();
  else if(e.key==='ArrowLeft')prev();
});
window.addEventListener('load',render);
})();
</script>
</body>
</html>
